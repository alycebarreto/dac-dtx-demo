spring.application.name=jpa-persistencia
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
server.port=8081

# Seleciona a implementacao do DAO: "jpa" (EntityManager), "jdbc" (DataSource), "mongo" (MongoDB) ou "dtx" (transacao distribuida)
app.dao.impl=dtx

# MongoDB — usando local em Docker (porta 27017) pela instabilidade do Atlas.
# URI do enunciado (Atlas do professor) deixada como referencia abaixo.
app.mongo.uri=mongodb://localhost:27017
# app.mongo.uri=mongodb+srv://ciceroaraujo_db_user:MX4LoFyhjxVGr0Jp@cluster0.h8erc5h.mongodb.net/?appName=Cluster0
app.mongo.database=demo
